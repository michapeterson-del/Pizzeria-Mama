<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bestellungen – Pizzeria Mama Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<style>
  body { padding-bottom: 40px; }
  .topbar {
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 16px; background:var(--charcoal); color:#fff;
  }
  .topbar h2 { margin:0; font-size:1.1rem; }
  .topbar button { background:transparent; color:#f2c9a8; border:1px solid #f2c9a8; border-radius:8px; padding:6px 12px; }
  .filters { display:flex; gap:8px; padding:12px 16px; flex-wrap:wrap; }
  .filters button {
    background:#f4e9db; border-radius:999px; padding:6px 14px; font-size:0.85rem; color:var(--charcoal-2);
  }
  .filters button.active { background: var(--orange); color:#fff; }
  #orders { max-width: 720px; margin: 0 auto; padding: 0 12px; }
  .order-card {
    background:#fff; border-radius:14px; padding:14px 16px; margin-bottom:14px;
    box-shadow:0 2px 8px rgba(0,0,0,0.06); border-left: 6px solid #ccc;
  }
  .order-card.neu { border-left-color: #e0a03a; }
  .order-card.bestaetigt { border-left-color: #4c7a3f; }
  .order-card.fertig { border-left-color: #1c7ea8; }
  .order-card.abgeholt { border-left-color: #999; opacity: 0.7; }
  .order-card.storniert { border-left-color: #a3311a; opacity: 0.6; }
  .order-head { display:flex; justify-content:space-between; align-items:baseline; }
  .order-head .nr { font-weight:700; font-size:1.05rem; }
  .order-head .time { font-size:0.78rem; color:var(--gray); }
  .order-customer { font-size:0.9rem; margin:4px 0 8px; color:var(--charcoal-2); }
  .order-customer a { color: var(--orange-dark); }
  .order-items { font-size:0.88rem; color:#444; margin-bottom:8px; }
  .order-items div { display:flex; justify-content:space-between; padding:2px 0; }
  .order-note { font-size:0.85rem; background:#fdf1de; padding:6px 10px; border-radius:8px; margin-bottom:8px; }
  .order-actions { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .order-actions input[type=time] { padding:8px; border-radius:8px; border:1px solid #ddd; }
  .order-actions button {
    padding:8px 14px; border-radius:8px; font-size:0.85rem; font-weight:600;
  }
  .btn-confirm { background: var(--green); color:#fff; }
  .btn-ready { background: #1c7ea8; color:#fff; }
  .btn-picked { background: #666; color:#fff; }
  .btn-cancel { background: #fbe4e0; color:#a3311a; }
  .pickup-shown { font-weight:700; color:var(--green); }
  .empty { text-align:center; color:var(--gray); padding:40px 0; }
  .item-note { font-size:0.78rem; color:#96631a; font-style:italic; }
  .item-sauce { font-size:0.78rem; color:#4c7a3f; font-weight:600; }
  .wish-box {
    font-size:0.9rem; background:#fdf1de; color:var(--charcoal-2);
    padding:8px 12px; border-radius:8px; margin-bottom:8px; border-left:4px solid #e0a03a;
  }
  .wish-box b { color:var(--orange-dark); }
  .hint-inline { flex-basis:100%; font-size:0.75rem; color:var(--gray); margin:-4px 0 2px; }
  .topbar-actions { display:flex; gap:8px; align-items:center; }
  #notifBtn.on { background: var(--green); color:#fff; border-color: var(--green); }
  .new-order-banner {
    display:none;
    max-width:720px; margin:0 auto; padding:10px 16px;
    background:#e0a03a; color:#fff; text-align:center; font-weight:700; font-size:0.9rem;
    border-radius:0 0 12px 12px;
  }
</style>
</head>
<body>
<div class="topbar">
  <h2>🍕 Bestellungen</h2>
  <div class="topbar-actions">
    <button id="notifBtn">🔔 Ton aktivieren</button>
    <button id="logoutBtn">Abmelden</button>
  </div>
</div>
<div class="new-order-banner" id="newOrderBanner"></div>
<div class="filters" id="filters">
  <button data-f="offen" class="active">Offen</button>
  <button data-f="alle">Alle</button>
</div>
<div id="orders"></div>

<script src="admin.js"></script>
</body>
</html>
